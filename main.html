<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reconstruction of our church</title>
    <link rel="stylesheet" href="style.css">
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    </head>

<body>
    <button id="menu-btn" class="hamburger">&#9776;</button>
    <div id="side-menu" class="side-menu">
        <button id="close-btn" class="close-btn">&times;</button>
        <nav>
            <h3>Menu</h3>
            <a href="settings.html" class="menu-link">Settings</a>
        </nav>
    </div>
    <div id='overlay' class="overlay"></div>
    <header>
        <h1>Reconstruction of our church</h1>
        <h2>Hello <span id="user-display-name">Jack Sparrow</span></h2>
        <h2>See our church after the renovation!</h2>
        <model-viewer
            src = "church.glb"
            alt = "3D model of church"
            auto-rotate
            camera-controls
            shadow-intensity="1"
            max-camera-orbit="auto 90deg auto"
            style="width:100%; height: 350px; background-color:#ffffff; border-radius: 15px; margin-bottom: 15px;">
        </model-viewer>
    </header>
    <main>
    <section id="Visualization">
        <p>See our works progress...</p>
        <div class="progress-container">
            <div id="progress-bar"></div>   
        </div>
        <p id = "progress-text">0% of our goal</p>
        </section>
    <section id="Counter">
        <p>We have got already:</p>
        <div id="totalBricks">0</div>
        </section>
    <section id="Donation">
        <h2>Purchase an istone</h2>
        <p>Your total purchases: <span id='user-bricks-count'>0</span></p>
        <button id="buyButton">I've sent my money. Give me a letter of gratitude</button>
        
        </section>
    </main>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script> <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <script src="script.js"></script>
    </body>
</html>
